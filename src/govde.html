<div id="app" data-world="ay">
  <section id="title">
    <canvas id="titleBg"></canvas>
    <div class="t-wrap" id="titleInner"></div>
  </section>
  <section id="game" hidden>
    <canvas id="c3" tabindex="0" aria-label="3D"></canvas>
    <div id="hud">
      <div id="hudTL"></div>
      <div id="hudTR"></div>
      <div id="hudTC"><div id="planBar" hidden></div><div id="objective"></div><div id="objHow" hidden></div><div id="pwWarn" hidden aria-live="polite"></div><div id="effects" hidden></div><div id="banner" hidden></div><div id="calls"></div></div>
      <div id="cross"><svg viewBox="0 0 40 40" aria-hidden="true"><circle id="scanArc" cx="20" cy="20" r="15" pathLength="100"/><path d="M20 15v4M20 21v4M15 20h4M21 20h4"/></svg></div>
      <div id="prompt" hidden></div>
      <div id="markers"></div>
      <div id="planLabel" hidden></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="scanCard" hidden></div>
      <div id="sub" hidden aria-live="polite" data-act="subNext"></div>
      <div id="gauges"></div>
      <div id="hudBR"><div id="acts"></div></div>
      <button id="undoBtn" class="btn" data-act="undo" hidden></button>
      <button id="planOk" class="primary big" data-act="planOk" hidden></button>
      <div id="drawer" hidden></div>
      <div id="chapter" hidden></div>
    </div>
    <p id="sceneCap" hidden></p>
    <button id="skipBtn" class="primary" data-act="skipScene" hidden></button>
    <div id="veil" hidden data-act="awayGo"><div><b class="veil-t"></b><span class="veil-d"></span></div></div>
    <div id="pda" hidden><div id="pdaBox" role="dialog" aria-modal="true"><header id="pdaHead"></header><div id="pdaStat"></div><div id="pdaBody"></div></div></div>
    <div id="fade" hidden></div>
    <div id="egDone" hidden></div>
  </section>
  <div id="modal" hidden><div id="crStage" aria-hidden="true"></div><div id="modalBox" role="dialog" aria-modal="true"></div></div>
</div>
